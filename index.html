different idea of what work is." }, Nm = { desktop: 100, mobile: 250 }, Uu = ["ai is changing the world", "anyone can build so the value lies in the distribution", "jobs will change but never disappear", "the human in the loop becomes the most valuable and the bottlenecked resource", "8x supplies and orchestrates those humans", "implications are global and generational"], kc = ["the loop starts to change", "the loop disperses", "reshaped — no dot lost", "one human in the loop", "orchestrated", "the system widens"], cm = 3, e1 = { structure: "The company is organised into verticals. Each one has a vertical lead, and each orchestrates a large number of people against one key metric.", inheritance: "Each new vertical inherits the architecture and the experience of the ones before it, so every one starts further along than the last." }, go = [{ name: "8x Social", line: "Consumer brands. TikTok, Instagram, YouTube.", built: "A managed creator network. More than 250,000 creators across 50 countries make organic video for brands, with no ad spend behind it.", metric: "Virality potential", domain: "8x.social", href: "https://8x.social/" }, { name: "8x LinkedIn", line: "B2B demand, on LinkedIn.", built: "A B2B creator marketplace. Brands brief vetted LinkedIn creators and follow the work from impressions through to closed deals.", domain: "8x.business", href: "https://8x.business/" }, { name: "8x Research", line: "Market and niche research.", built: "AI-moderated user research. Hundreds of one-to-one interviews run in parallel and come back as ranked themes with the quotes behind them.", domain: "8xresearch.com", href: "https://8xresearch.com/" }, { name: "8x Sales", line: "Outbound and cold calling.", built: "A remote sales floor. People learn to sell on real calls with live coaching, and are paid per booking and per qualified meeting.", metric: "Meetings booked", domain: "8x.sale", href: "https://8x.sale/" }, { name: "8x Hiring", line: "Evidence-first hiring, at 8x and partner companies.", built: "You apply on the site, and the role’s practical assignment is issued the moment you submit.", domain: "8x.careers", href: "https://www.8x.careers/" }, { name: "8x Email", line: "Not unlocked yet.", locked: !0 }, { name: "8x Global", line: "Not unlocked yet.", locked: !0 }], w2 = [{ fact: "Find a role and send us your work.", source: "8x.careers", fits: "You would rather be judged on what you made than on how you describe it.", misfits: "You want your CV and an interview loop to do the talking." }, { fact: "The role’s practical assignment is issued the moment you submit.", source: "8x.careers", fits: "Being asked to do the work on day zero sounds fair, not rude.", misfits: "You expect a few conversations before anyone asks for output." }, { fact: "Internship (2 week trial).", source: "Market Lead & Global Sales intern roles", fits: "Two weeks of real work is a better test than two months of process.", misfits: "You need a long runway before your work is evaluated." }, { fact: "No CV requirements. Show us you are hungry and can execute.", source: "Global Sales Intern — 8x LinkedIn", fits: "Your track record is thin but your output isn’t.", misfits: "Credentials are the part of you that you want to lead with." }, { fact: "Small budgets on purpose: the job is finding what works before anyone spends real money.", source: "Paid Ads Manager", fits: "Constraints make you sharper.", misfits: "You do your best work once the budget is large." }, { fact: "Hands in the account, not managing an agency.", source: "Paid Ads Manager", fits: "You want to do the work yourself.", misfits: "You would rather direct others who do it." }, { fact: "You are the first dedicated designer, so the taste and the output are yours.", source: "Graphic Designer", fits: "Being first — with nobody to defer to — is the appeal.", misfits: "You want an established team, system and reviewer above you." }, { fact: "Own a full product end to end.", source: "Software Engineer", fits:
